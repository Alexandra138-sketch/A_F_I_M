openapi: 3.0.3
info:
  title: API de Sugestões dos Alunos
  # 2.0.0 (e não 1.1.0): o numeroAluno e o responsavel deixam de ir no corpo e
  # as operações passam a exigir token. Clientes da v1 deixam de funcionar.
  version: 2.0.0
  description: >
    API para os alunos submeterem sugestões, os serviços acompanharem o seu
    tratamento e qualquer pessoa consultar estatísticas de resolução.
    As operações sobre sugestões exigem autenticação com um token JWT (esquema
    Bearer), obtido em POST /tokens; as estatísticas, as categorias e a emissão
    de tokens são públicas.
servers:
  # Alterado de /v1 para /v2
  - url: https://api.estgv.exemplo/v2
 
# Segurança GLOBAL: todas as operações exigem tokenJWT, a menos que declarem
# "security: []". Assim, uma operação nova esquecida fica protegida por omissão.
# A lista é vazia porque, num esquema http, não existem scopes (só em oauth2).
security:
  - tokenJWT: []
 
paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      description: >
        Papel admitido: aluno ou servicos. Um aluno obtém apenas as suas
        sugestões; os serviços obtêm todas.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Estado'
        - name: categoria
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CodigoCategoria'
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: tamanhoPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Página de sugestões que cumprem os filtros
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivadoNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        default:
          $ref: '#/components/responses/ErroInesperado'
    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      description: >
        Papel admitido: aluno. O numeroAluno da sugestão é o do token (claim
        sub), nunca o do corpo do pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '201':
          description: Sugestão criada; o cabeçalho Location indica o seu URL
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
  /sugestoes/{id}:
    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      description: >
        Papel admitido: aluno ou servicos. Um aluno só acede às suas
        sugestões; os serviços acedem a qualquer uma.
      parameters:
        - $ref: '#/components/parameters/IdSugestao'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A sugestão pedida
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CachePrivadoNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                id: 42
                titulo: Mais tomadas na biblioteca
                descricao: Propõe-se a instalação de mais tomadas junto às mesas de estudo da biblioteca.
                categoria: instalacoes
                numeroAluno: '12345'
                estado: aceite
                dataCriacao: '2026-10-02T09:15:00Z'
                dataAtualizacao: '2026-10-09T14:30:00Z'
                dataResolucao: null
        '304':
          description: A cópia que o cliente tem continua válida
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CachePrivadoNoCache'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        default:
          $ref: '#/components/responses/ErroInesperado'
    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      description: >
        Papel admitido: aluno, apenas as suas sugestões. Os serviços recebem 403.
      parameters:
        - $ref: '#/components/parameters/IdSugestao'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '200':
          description: Sugestão substituída; o ETag identifica a nova versão
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoEdicao'
        '412':
          $ref: '#/components/responses/PrecondicaoFalhada'
        default:
          $ref: '#/components/responses/ErroInesperado'
    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão ainda submetida
      description: >
        Papel admitido: aluno, apenas as suas sugestões. Os serviços recebem 403.
      parameters:
        - $ref: '#/components/parameters/IdSugestao'
      responses:
        '204':
          description: Sugestão retirada
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoRetirada'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
  /sugestoes/{id}/acompanhamentos:
    get:
      operationId: listarAcompanhamentos
      summary: Histórico de acompanhamento, do mais antigo para o mais recente
      description: >
        Papel admitido: aluno ou servicos. Um aluno só acede aos
        acompanhamentos das suas sugestões; os serviços acedem a todos.
      parameters:
        - $ref: '#/components/parameters/IdSugestao'
      responses:
        '200':
          description: Acompanhamentos da sugestão, do mais antigo para o mais recente
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivadoNoCache'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        default:
          $ref: '#/components/responses/ErroInesperado'
    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      description: >
        Papel admitido: servicos. Um aluno recebe 403. O responsavel é o nome
        constante do token (claim nome), nunca o do corpo do pedido.
      parameters:
        - $ref: '#/components/parameters/IdSugestao'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      responses:
        '201':
          description: Acompanhamento registado e estado da sugestão alterado
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoTransicao'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
  # --- Operações PÚBLICAS: "security: []" anula o security global ---
  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      security: []
      parameters:
        - $ref: '#/components/parameters/AnoLetivo'
      responses:
        '200':
          description: Estatísticas de resolução do ano letivo pedido
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePublicoUmaHora'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
              example:
                anoLetivo: '2026-2027'
                totalSugestoes: 120
                porEstado:
                  submetida: 20
                  em_analise: 15
                  aceite: 25
                  rejeitada: 20
                  resolvida: 40
                taxaResolucao: 0.3333
                tempoMedioResolucaoDias: 18.5
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Os mesmos indicadores, por categoria
      security: []
      parameters:
        - $ref: '#/components/parameters/AnoLetivo'
      responses:
        '200':
          description: Estatísticas por categoria do ano letivo pedido
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePublicoUmaHora'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      security: []
      responses:
        '200':
          description: As cinco categorias e a sua descrição
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePublicoUmDia'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
  # --- 11.ª operação (NOVA): login, pública porque é aqui que se obtém o token ---
  /tokens:
    post:
      operationId: criarToken
      summary: Autenticar e obter um token JWT
      description: >
        Operação pública. Troca as credenciais (número de aluno ou
        nome.apelido, mais palavra-passe) por um token com validade de 900
        segundos, sem renovação. Responde 200 (e não 201) porque não cria um
        recurso com URL próprio, pelo que não há Location.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: Credenciais válidas; devolve o token
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSIsIm5vbWUiOiJBbmEgU2lsdmEiLCJwYXBlbCI6ImFsdW5vIiwiaWF0IjoxNzkxNTU0NDAwLCJleHAiOjE3OTE1NTUzMDB9.YXNzaW5hdHVyYS1kZS1leGVtcGxv
                tipo: Bearer
                expiraEm: 900
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        default:
          $ref: '#/components/responses/ErroInesperado'
 
components:
  securitySchemes:
    tokenJWT:
      type: http
      scheme: bearer
      # bearerFormat é apenas informativo: o OpenAPI não valida o token.
      bearerFormat: JWT
      description: |
        Token JWT obtido em POST /tokens e enviado em `Authorization: Bearer <token>`.
        O papel exigido por cada operação não é exprimível em `security` (um
        esquema http não tem scopes), por isso consta da description de cada operação.
 
        | Claim | Tipo | Significado |
        |-------|------|-------------|
        | sub | string | Utilizador: número de aluno ou identificador nome.apelido |
        | nome | string | Nome completo do utilizador (usado como responsavel nos acompanhamentos) |
        | papel | string | `aluno` ou `servicos` |
        | iat | inteiro | Instante de emissão, em segundos desde 1970-01-01T00:00:00Z |
        | exp | inteiro | Instante de expiração, em segundos desde 1970-01-01T00:00:00Z |
 
  schemas:
    Estado:
      type: string
      enum: [submetida, em_analise, aceite, rejeitada, resolvida]
 
    CodigoCategoria:
      type: string
      enum: [instalacoes, ensino, servicos, atividades, outra]
 
    Categoria:
      type: object
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        descricao:
          type: string
          minLength: 3
          maxLength: 80
      required: [codigo, descricao]
 
    # numeroAluno REMOVIDO: passa a vir do token (claim sub)
    SugestaoNova:
      type: object
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: '#/components/schemas/CodigoCategoria'
      required: [titulo, descricao, categoria]
 
    Sugestao:
      allOf:
        - $ref: '#/components/schemas/SugestaoNova'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            # NOVO aqui: atribuído pelo servidor, só de leitura e obrigatório
            numeroAluno:
              type: string
              pattern: '^[0-9]{5,8}$'
              readOnly: true
            estado:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true
          required: [id, numeroAluno, estado, dataCriacao, dataAtualizacao, dataResolucao]
 
    # responsavel REMOVIDO: passa a vir do token (claim nome)
    AcompanhamentoNovo:
      type: object
      properties:
        novoEstado:
          $ref: '#/components/schemas/Estado'
        nota:
          type: string
          minLength: 5
          maxLength: 500
      required: [novoEstado, nota]
 
    Acompanhamento:
      allOf:
        - $ref: '#/components/schemas/AcompanhamentoNovo'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estadoAnterior:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            # NOVO aqui: atribuído pelo servidor, só de leitura e obrigatório
            responsavel:
              type: string
              minLength: 5
              maxLength: 60
              pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true
          required: [id, estadoAnterior, responsavel, data]
 
    # NOVO: corpo do login
    Credenciais:
      type: object
      properties:
        utilizador:
          type: string
          # número de aluno (5 a 8 algarismos) OU nome.apelido em minúsculas, num único pattern
          pattern: '^([0-9]{5,8}|[a-z]+\.[a-z]+)$'
        palavraPasse:
          type: string
          minLength: 8
          maxLength: 128
          format: password
      required: [utilizador, palavraPasse]
 
    # NOVO: resposta do login
    Token:
      type: object
      properties:
        token:
          type: string
          # três partes base64url separadas por pontos
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        tipo:
          type: string
          enum: [Bearer]
        expiraEm:
          type: integer
          minimum: 1
          description: Validade do token, em segundos
      required: [token, tipo, expiraEm]
 
    ListaSugestoes:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Sugestao'
      required: [pagina, tamanhoPagina, total, itens]
 
    EstatisticasResolucao:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
          required: [submetida, em_analise, aceite, rejeitada, resolvida]
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true
      required: [anoLetivo, totalSugestoes, porEstado, taxaResolucao, tempoMedioResolucaoDias]
 
    EstatisticasCategorias:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              categoria:
                $ref: '#/components/schemas/CodigoCategoria'
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1
            required: [categoria, total, resolvidas, taxaResolucao]
      required: [anoLetivo, categorias]
 
    Erro:
      type: object
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              problema:
                type: string
            required: [campo, problema]
      required: [codigo, mensagem]
 
  parameters:
    IdSugestao:
      name: id
      in: path
      required: true
      description: Identificador da sugestão
      schema:
        type: integer
        minimum: 1
    AnoLetivo:
      name: anoLetivo
      in: query
      required: true
      description: Ano letivo no formato AAAA-AAAA
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{4}$'
 
  headers:
    CacheNoStore:
      schema:
        type: string
        enum: ['no-store']
    CachePrivadoNoCache:
      schema:
        type: string
        enum: ['private, no-cache']
    CachePublicoUmaHora:
      schema:
        type: string
        enum: ['public, max-age=3600']
    CachePublicoUmDia:
      schema:
        type: string
        enum: ['public, max-age=86400']
    ETag:
      description: Identificador da versão do recurso
      schema:
        type: string
    Location:
      description: URL do recurso criado
      schema:
        type: string
    # NOVO: indica ao cliente o esquema de autenticação exigido (RFC 6750)
    WWWAuthenticate:
      description: Esquema de autenticação exigido
      schema:
        type: string
        enum: ['Bearer', 'Bearer error="invalid_token"']
 
  responses:
    # --- NOVAS ---
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: 401
            mensagem: Token ausente, inválido ou expirado
    CredenciaisInvalidas:
      description: Utilizador ou palavra-passe incorretos (mensagem idêntica nos dois casos; sem WWW-Authenticate)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Proibido:
      description: Pedido autenticado, mas o papel do utilizador não permite esta operação
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    # --- EXISTENTES ---
    PedidoInvalido:
      description: Pedido mal formado ou dados que não cumprem o schema
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      # description alterada: o 404 passa a cobrir também sugestões de outros alunos
      description: >
        Não existe sugestão com esse id. É também a resposta a um aluno que
        pede uma sugestão de que não é autor, para não revelar que existe.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ConflitoEdicao:
      description: A sugestão já não está no estado submetida e, por isso, já não pode ser editada
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ConflitoRetirada:
      description: A sugestão já não está no estado submetida e, por isso, já não pode ser retirada
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ConflitoTransicao:
      description: A transição de estado pedida não é permitida. Só são válidas submetida para em_analise, em_analise para aceite ou rejeitada, e aceite para resolvida; uma sugestão rejeitada ou resolvida está fechada
